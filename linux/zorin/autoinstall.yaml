#cloud-config
# Win2Linux Unattended Autoinstall Configuration for Zorin OS 17.2
# Generated by Win2Linux Dual-Boot Installer
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  identity:
    hostname: zorin-dualboot
    username: user
    password: "$6$rounds=4096$win2linux$placeholder"
    realname: "Linux User"
  ssh:
    install-server: false
  storage:
    layout:
      name: direct
  packages:
    - efibootmgr
    - grub-efi-amd64-signed
    - shim-signed
    - os-prober
    - ntfs-3g
  late-commands:
    # Ensure os-prober detects Windows Boot Manager
    - curtin in-target --target=/target -- sed -i 's/#GRUB_DISABLE_OS_PROBER=false/GRUB_DISABLE_OS_PROBER=false/' /etc/default/grub
    - curtin in-target --target=/target -- update-grub
