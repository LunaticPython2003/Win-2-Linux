#cloud-config
# Win2Linux Unattended Autoinstall Configuration for Zorin OS 17.2
# Generated by Win2Linux Dual-Boot Installer
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  identity:
    hostname: zorin-dualboot
    username: user
    password: "$6$rounds=4096$win2linux$placeholder"
    realname: "Linux User"
  ssh:
    install-server: false
  storage:
    layout:
      name: direct
  packages:
    - efibootmgr
    - grub-efi-amd64-signed
    - shim-signed
    - os-prober
    - ntfs-3g
  late-commands:
    # Regenerate GRUB menu. os-prober may fail on BitLocker-protected
    # Windows volumes; failure is non-fatal because Windows Boot Manager
    # remains independently available through UEFI firmware.
    - curtin in-target --target=/target -- bash -c "sed -i 's/^#\?GRUB_DISABLE_OS_PROBER=.*/GRUB_DISABLE_OS_PROBER=false/' /etc/default/grub || true"
    - curtin in-target --target=/target -- bash -c "if ! update-grub; then echo 'Win2Linux - update-grub failed; continuing because UEFI Windows Boot Manager is preserved.'; fi"
