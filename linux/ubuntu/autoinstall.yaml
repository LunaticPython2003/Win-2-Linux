#cloud-config
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard:
    layout: us
  identity:
    hostname: ubuntu-dualboot
    username: user
    password: "$6$rounds=4096$win2linux$QnI9sQv8mUqPZtK7NqP/eC3Ie3x0k4r7y9rT9M6Z9k3y6p5w4" # Default initial hash (user will be prompted on first login)
    realname: "Linux User"
  ssh:
    install-server: true
    allow-pw: true
  storage:
    layout:
      name: direct
  packages:
    - efibootmgr
    - grub-efi-amd64-signed
    - shim-signed
    - os-prober
    - ntfs-3g
  late-commands:
    # Ensure os-prober is enabled so Windows Boot Manager is automatically detected in GRUB
    - curtin in-target --target=/target -- sed -i 's/#GRUB_DISABLE_OS_PROBER=false/GRUB_DISABLE_OS_PROBER=false/' /etc/default/grub
    - curtin in-target --target=/target -- update-grub
